upstream php {
        server php1:9000 weight=1;
}

# ─────────────────────────────────────────────────────────────────────
# 反向代理層整合
# ─────────────────────────────────────────────────────────────────────
# 只信任下列來源送來的 X-Forwarded-*；非信任來源直連時 XFF 一律忽略，
# 避免攻擊者偽造來源 IP 繞過下方的內網判斷與限流。
# TODO: 收斂成實際反向代理的 IP/CIDR（範圍越小越安全）
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# 代理層終止 TLS 時，把協定轉成 PHP 看得懂的 $_SERVER['HTTPS']，
# 否則 WordPress 會產生 http:// 連結造成無限轉址／混合內容。
map $http_x_forwarded_proto $fcgi_https {
        default "";
        https   "on";
}

# wp-login.php 暴力破解限流：非登入請求的 key 為空字串，nginx 會跳過限流，
# 因此不影響一般瀏覽與後台操作。
# 用 $uri（已解碼正規化）而非 $request_uri，否則 /wp-%6cogin.php 可繞過限流。
map $uri $wplogin_limit_key {
        default                     "";
        ~*^/(cms/)?wp-login\.php$   $binary_remote_addr;
}
limit_req_zone $wplogin_limit_key zone=wplogin:10m rate=30r/m;

# headless：REST／GraphQL 是唯一對外的公開介面，加一層防爬取／濫用限流。
# 這裡必須用 $request_uri（原始路徑）：limit_req 在 preaccess 階段執行，
# 此時 wp-json 已被 rewrite 成 /index.php，$uri 會比對不到。
# 10r/s 是為了容納前端 SSR 同一來源 IP 的並發突發；若前端只在建置期抓取可再收緊。
# 新增任何對外 API 路徑時，這個 map 必須同步涵蓋，否則新路徑完全沒有限流。
map $request_uri $wpapi_limit_key {
        default                          "";
        ~*^/(cms/)?(wp-json|graphql)     $binary_remote_addr;
}
limit_req_zone $wpapi_limit_key zone=wpapi:10m rate=600r/m;

# ─────────────────────────────────────────────────────────────────────
# headless：後台／登入／cron 限內網存取
# ─────────────────────────────────────────────────────────────────────
# 這是純後台 CMS 最有效的一道防線：把登入頁與後台整個移出公網可達範圍，
# 暴力破解與針對 wp-admin 的 0-day 掃描根本打不到。
#
# geo 比對的是 $remote_addr，而 real_ip 已在此之前把它還原成真實客戶端 IP，
# 因此透過反向代理進來的公網使用者會被正確擋下。
#
# ⚠ 前提：反向代理必須確實送出 X-Forwarded-For。若沒有送，$remote_addr 會是
#   代理本身的內網 IP，下面的判斷會全部視為內網而讓這道防線靜默失效。
#   上線後請務必從公網實際打一次 /wp-login.php 確認拿到 403。
# TODO: 收斂成實際的內網／VPN CIDR。目前放行整個 RFC1918 是為了避免把你鎖在外面。
geo $client_is_internal {
        default         0;
        127.0.0.0/8     1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
}

# 必須用 $uri（已解碼正規化）；用 $request_uri 會被 /wp-%61dmin/ 這類
# 百分號編碼繞過 —— nginx 之後仍會解碼並正常提供檔案。
# `(cms/)?` 讓舊路徑在轉換期間也受同一道閘門保護，不必倚賴 301 轉址生效。
map $uri $is_internal_only_area {
        default                      0;
        ~*^/(cms/)?wp-admin/         1;
        ~*^/(cms/)?wp-login\.php$    1;
        ~*^/(cms/)?wp-cron\.php$     1;
}

map "$is_internal_only_area:$client_is_internal" $block_internal_only {
        default   0;
        "1:0"     1;
}

server {
        listen 80;
        server_name _;

        # WordPress 直接掛在網站根目錄。
        # 這裡刻意用 root 而非過去的 `location /cms { alias /wp_www; }`：
        # prefix location 搭 alias 是 nginx 的經典地雷 —— 只要 alias 尾端多一條
        # 斜線（alias /wp_www/），/cms../etc/passwd 就會變成任意檔案讀取。
        # root 沒有這個失效模式。
        root /wp_www;
        index index.php;

        # 與 PHP 的 post_max_size / upload_max_filesize (20M) 對齊，
        # 避免 nginx 先收滿再被 PHP 退回，形成廉價的資源消耗管道。
        client_max_body_size 20M;

        # 隱藏版本資訊（nginx 標頭與錯誤頁、PHP 的 X-Powered-By）
        server_tokens off;
        fastcgi_hide_header X-Powered-By;

        # 反向代理後必備：nginx 自動補上的轉址（例如目錄少了尾斜線的 /wp-admin）
        # 預設會組成絕對 URL，只看得到自己 listen 的 80 埠與 http，
        # 結果把使用者導到錯誤的 host/scheme 而中斷登入流程。
        # 關掉後改發相對路徑 Location，由瀏覽器沿用原本的 scheme/host/port。
        absolute_redirect off;

        # 基本安全標頭。注意：若反向代理層也加同名標頭會重複，請二者只留一處。
        # HSTS 應由終止 TLS 的代理層負責，這裡不設。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # headless：此主機只有後台與 API，任何回應都不該被搜尋引擎收錄
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        limit_req zone=wplogin burst=15 nodelay;
        limit_req zone=wpapi   burst=50 nodelay;

        # headless：後台／登入／cron 一律限內網。
        # 放在 server 層級的 rewrite 階段，早於 location 選取，因此同時涵蓋
        # 後台的 PHP 與 CSS/JS/圖片，不需要在多個 location 重複 allow/deny，
        # 也不必複製 FastCGI 設定。
        if ($block_internal_only) {
                return 403;
        }

        # ── 舊 /cms 路徑相容（轉換期用，反向代理切換完成後即可移除）──────────
        # 301 到根路徑等價位置。轉址後的新路徑會重新走完整套規則，
        # 因此不需要為 /cms/* 重複維護任何 deny 規則。
        location = /cms {
                return 301 /wp-admin/;
        }
        location ~ ^/cms/(.*)$ {
                return 301 /$1;
        }

        # ── 安全：deny 規則 ────────────────────────────────────────────────
        # 全部在 server 層級，依宣告順序 first-match-wins，且 regex location
        # 優先於 prefix location，所以這些規則都會早於下方的 `\.php$` 生效。
        # （移除 alias 之後不再需要巢狀在某個 location 內，順序推理單純很多。）

        # 封鎖 dotfile（.git/.env/.htaccess 等），保留 ACME 驗證
        location ~ /\.(?!well-known\/) {
                deny all;
                access_log off;
                log_not_found off;
        }

        # 封鎖備份／傾印／設定檔。wp-config.php.bak 之類會以純文字回傳 DB 帳密，
        # wp-content/debug.log 會外洩路徑與堆疊。
        location ~* \.(bak|backup|old|orig|original|save|swp|swo|tmp|dist|sql|log|ini|conf|sh|yml|yaml|env)$ {
                deny all;
                access_log off;
                log_not_found off;
        }
        location ~ ~$ {
                deny all;
        }

        # xmlrpc.php 是密碼暴力破解放大器與 pingback DDoS 反射點。
        # 下方根目錄 PHP 白名單其實已涵蓋它，這裡另立 exact match 是為了
        # 關掉它的 access log —— 它是掃描流量最集中的單一路徑。
        # 若確實需要 Jetpack／App 發文，改為 allow 指定來源後再 deny all。
        location = /xmlrpc.php {
                deny all;
                access_log off;
                log_not_found off;
        }

        # headless：根目錄下的 PHP 採白名單，只放行實際需要的三個。
        # 用白名單而非逐一列舉黑名單，是為了避免日後 WordPress 或外掛新增
        # 根目錄檔案時漏掉。`[^/]+` 限定只比對根目錄層（不影響 /wp-admin/*.php）。
        #
        # 這一條涵蓋：
        #   - wp-config.php          直接請求會完整 bootstrap WordPress，
        #                            出錯時會把絕對路徑吐在回應裡
        #   - wp-load.php / wp-settings.php / wp-blog-header.php
        #                            bootstrap 檔案，不該被單獨請求
        #   - wp-trackback.php / wp-comments-post.php
        #                            垃圾留言與 pingback 反射攻擊的固定目標，
        #                            headless 沒有留言功能
        #   - wp-signup.php / wp-activate.php / wp-mail.php / wp-links-opml.php
        #                            自助註冊、郵件發文、OPML，headless 都不需要
        #
        # 放行的三個：index.php（REST/GraphQL 入口）、wp-login.php 與
        # wp-cron.php（兩者另受上方內網閘門保護）。
        location ~ ^/(?!index\.php$|wp-login\.php$|wp-cron\.php$)[^/]+\.php$ {
                deny all;
                access_log off;
                log_not_found off;
        }

        # 封鎖 uploads 內的 PHP 執行（避免上傳漏洞變成 RCE）
        location ~* ^/wp-content/uploads/.+\.(php|phtml|php[3-8]|phps|pht|shtml)$ {
                deny all;
        }

        # headless：不繪任何佈景主題，主題目錄下的 PHP 不需要能被 HTTP 直接請求。
        # 後台是透過 WordPress bootstrap 載入 functions.php，不走 HTTP，故不受影響。
        location ~* ^/wp-content/themes/.+\.php$ {
                deny all;
        }

        # 站台安裝完成後，安裝腳本不應對外開放（重裝時再暫時移除）
        location ~* ^/wp-admin/(install|setup-config)\.php$ {
                deny all;
        }

        # wp-includes 下的 PHP 不應被直接請求（保留 TinyMCE 與多站台檔案代理）
        location ~* ^/wp-includes/(?!js/tinymce/wp-tinymce\.php|ms-files\.php).+\.php$ {
                deny all;
        }

        # 版本資訊揭露（wp-config-sample.php 已由根目錄 PHP 白名單涵蓋）
        location ~* ^/(readme\.html|license\.txt)$ {
                deny all;
        }

        # ── 對外 API ─────────────────────────────────────────────────────
        # 前台路由已關閉，所以 REST 與 GraphQL 必須在此明確導到 index.php，
        # 不能倚賴 WordPress 自己的 rewrite 規則。
        location /wp-json/ {
                rewrite ^/wp-json/(.*)$ /index.php?rest_route=/$1 last;
        }
        # 不帶尾斜線的 /wp-json 是 REST 探索端點，缺這段會 404
        location = /wp-json {
                rewrite ^ /index.php?rest_route=/ last;
        }
        # WPGraphQL 註冊的查詢變數是 graphql=true。
        # 用錨定 regex 而非 prefix location，否則 /graphqlfoo 也會被吃進來。
        location ~ ^/graphql/?$ {
                rewrite ^ /index.php?graphql=true last;
        }

        # ── PHP 交付 ─────────────────────────────────────────────────────
        location ~ \.php$ {
                # 安全：只把真實存在的檔案交給 FPM，擋掉 /x.jpg/shell.php
                # 這類 path-info 注入（與 php.ini 的 cgi.fix_pathinfo=0 互為縱深防禦）
                if (!-f $request_filename) {
                        return 404;
                }
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass php;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                # 代理層 TLS 資訊，讓 WordPress 產生正確的 https:// 連結
                fastcgi_param HTTPS $fcgi_https if_not_empty;
                # 安全：httpoxy (CVE-2016-5385)，nginx 內建 fastcgi_params 未清空此值
                fastcgi_param HTTP_PROXY "";
        }

        # ── 靜態資源 ─────────────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4|webm)$ {
                expires max;
                log_not_found off;
        }

        # ── 入口與其他 ───────────────────────────────────────────────────
        # 根路徑直接導向後台（headless 沒有首頁可看）
        location = / {
                return 302 /wp-admin/;
        }

        # headless：站台不該被收錄，直接由 nginx 回覆，不啟動 PHP
        location = /robots.txt {
                default_type text/plain;
                return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /favicon.ico {
                log_not_found off;
                access_log off;
        }

        # headless：不再把找不到的路徑丟給 WordPress 前台路由。
        # 原本的 index.php fallback 會啟動整個前台：永久連結、彙整頁、
        # 搜尋（查詢字串會被反射進頁面）、feed、?author=N 使用者列舉，
        # 全都是純後台情境下不需要卻要負責的攻擊面。
        # 後台目錄請求（/wp-admin/）仍由 `$uri/` + index 指令解析。
        location / {
                try_files $uri $uri/ =404;
        }
}
