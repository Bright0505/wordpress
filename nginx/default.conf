upstream php {
        server php1:9000 weight=1;
}

server {
        listen 80;
        server_name _;
        index index.php;
        client_max_body_size 100M;

    # 安全：封鎖 dotfile（.git/.env/.htaccess/.gcs-backup-tmp 等），保留 ACME 驗證
    location ~ /\.(?!well-known\/) {
        deny all;
    }

    # 打 /cms 或 /cms/ 直接導向後台管理介面（路徑式轉址，可在反向代理後正常運作）
    location = /cms {
        return 302 /cms/wp-admin/;
    }
    location = /cms/ {
        return 302 /cms/wp-admin/;
    }

    location /cms {
        alias /wp_www;
        try_files $uri $uri/ /cms/index.php?$args;
        
        location ~ ^/favicon\.ico$ {
            log_not_found off;
            access_log off;
        }
        
        location ~ ^/robots\.txt$ {
            allow all;
            log_not_found off;
            access_log off;
        }
        # 安全：封鎖 uploads 內的 PHP 執行（避免上傳漏洞變成 RCE）
        location ~* /wp-content/uploads/.+\.php$ {
                deny all;
        }
        location ~ \.php$ {
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass php;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4|webm)$ {
                expires max;
                log_not_found off;
                }
        }
    location /cms/wp-json/ {
        rewrite ^/cms/wp-json/(.*?)$ /cms/index.php?rest_route=/$1 last;
    }
    location /cms/graphql {
        rewrite ^/cms/graphql /cms/index.php?$1 last;
    }
}
